name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract android.zip
        run: |
          if [ -f android.zip ]; then unzip -o android.zip; fi
          ls -R | head -50
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          cd android 2>/dev/null || cd ai-studio/android 2>/dev/null || cd */android 2>/dev/null || cd .
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-APK
          path: '**/app-debug.apk'
